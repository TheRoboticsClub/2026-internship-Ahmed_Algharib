# The Site Configuration

# GitHub Pages needs a root-level config that points at the docs directory.
# This keeps the site source in docs/ while allowing the Pages workflow to
# resolve the Chirpy theme from the repository root.
source: docs
destination: docs/_site

# Import the theme
# This repo is intentionally using the project root as the Jekyll site root
# so GitHub Pages and the official action can resolve the theme correctly.
theme: jekyll-theme-chirpy

lang: en
timezone: Africa/Cairo

title: Ahmed | JdeRobot Internship 2026
tagline: Blog tracking my JdeRobot 2026 internship progress.
description: >-
  Ahmed's JdeRobot internship progress blog. documenting his work with
  ROS 2, Gazebo, MoveIt 2, industrial robotics, and open-source robotics.

url: "https://theroboticsclub.github.io"

github:
  username: ahmedabdallah00

social:
  name: Ahmed Algharib
  email: ahmed.algharib42@gmail.com
  links:
    - https://github.com/ahmedabdallah00

avatar: /assets/img/ahmed.jpeg

# Boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider:

paginate: 10

baseurl: "/2026-internship-Ahmed-Algharib"

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - README.md
  - LICENSE
  - docs
  - tools

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
